name: Deploy LemusBot

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, lemus-bot]
    steps:
      - name: Pull latest code
        run: |
          cd /opt/discord-daily-bot
          git pull origin main

      - name: Install dependencies
        run: |
          cd /opt/discord-daily-bot
          npm install --production

      - name: Restart bot
        run: sudo systemctl restart alfo-bot

      - name: Verify bot is running
        run: sleep 3 && sudo systemctl status alfo-bot --no-pager
